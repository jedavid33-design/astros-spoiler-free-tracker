<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Astros Spoiler-Free Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css?v=13">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
</head>

<body>

    <h1>&#9918; Julie's Game Day &#9918;</h1>

    <section id="gamePicker" class="game-picker">
        <h2>Which game do you want?</h2>
        <button class="today-game" onclick="loadToday()">
            <strong>Today's Game</strong>
            <span id="todayLabel"></span>
        </button>
        <button onclick="loadYesterday()">Yesterday's Game</button>
        <div class="date-picker-row">
            <input type="date" id="gameDate">
            <button onclick="loadPickedDate()">Choose Date</button>
        </div>
    </section>

    <main id="trackerView" class="hidden">
        <button class="change-game" onclick="showGamePicker()">&larr; Choose Another Game</button>

        <div class="navigation-controls">
            <button class="previous-nav" onclick="previousEvent()">Previous Event</button>
            <button class="forward-nav" onclick="nextAtBat()">Next At-Bat</button>
            <button class="forward-nav" onclick="nextInning()">Next Half-Inning</button>
            <button class="jump-live" onclick="jumpToLive()">Jump to Live</button>
        </div>

        <div id="status">Loading...</div>

        <button id="locationDebugExport" class="location-debug-export hidden" type="button" onclick="copyGameLocationDebug()">Copy all game location data</button>

        <button id="batterInfo" onclick="nextEvent()">
            Batter info will appear here.
        </button>

        <div id="eventList"></div>
    </main>
<div id="lineupModal" class="modal hidden">
    <div class="modal-content">
        <button class="modal-close" onclick="closeLineup()">&times;</button>
        <h2 id="lineupTitle"></h2>
        <div id="lineupBody"></div>
    </div>
</div>
<div id="fieldLocationModal" class="modal hidden" onclick="if (event.target === this) closeFieldLocation()">
    <div class="modal-content field-modal-content">
        <button class="modal-close" onclick="closeFieldLocation()" aria-label="Close ball location">&times;</button>
        <h2>Ball Location</h2>
        <p id="fieldLocationTitle" class="field-location-title"></p>
        <div id="fieldLocationBody"></div>
        <pre id="fieldLocationDebug" class="field-location-debug hidden" aria-label="Ball location diagnostic data"></pre>
        <button id="fieldLocationDebugCopy" class="field-location-debug-copy hidden" type="button" onclick="copyFieldLocationDebug()">Copy diagnostic data</button>
    </div>
</div>
    <script src="script.js?v=38"></script>

</body>
</html>
