<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Astros Spoiler-Free Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css?v=5">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
</head>

<body>

    <h1>&#9918; Julie's Game Day &#9918;</h1>

    <div>
    <button onclick="loadToday()">Today's Game</button>
    <button onclick="loadYesterday()">Yesterday's Game</button>

    <br><br>

    <input type="date" id="gameDate">
    <button onclick="loadPickedDate()">Load Date</button>
</div>

   <button onclick="previousEvent()">
    Previous Event
</button>
    
    <button onclick="nextAtBat()">
        Next At-Bat
    </button>

    <button onclick="nextInning()">
        Next Inning
    </button>

    <div id="status">
    Loading...
</div>

<button id="batterInfo" onclick="nextEvent()">
    Batter info will appear here.
</button>

<div id="eventList"></div>
<div id="lineupModal" class="modal hidden">
    <div class="modal-content">
        <button class="modal-close" onclick="closeLineup()">&times;</button>
        <h2 id="lineupTitle"></h2>
        <div id="lineupBody"></div>
    </div>
</div>
    <script src="script.js?v=26"></script>

</body>
</html>
