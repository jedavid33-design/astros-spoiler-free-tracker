<!DOCTYPE html>
<html>
<head>
    <title>Astros Spoiler-Free Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚾ Astros Spoiler-Free Tracker ⚾</h1>

    <div>
    <button onclick="loadToday()">Today's Game</button>
    <button onclick="loadYesterday()">Yesterday's Game</button>

    <br><br>

    <input type="date" id="gameDate">
    <button onclick="loadPickedDate()">Load Date</button>
</div>

    <button onclick="previousEvent()">
        Previous Event
    </button>

    <button onclick="nextEvent()">
        Next Event
    </button>

    <button onclick="nextAtBat()">
        Next At-Bat
    </button>

    <button onclick="nextInning()">
        Next Inning
    </button>

    <div id="status">
    Loading...
</div>

<div id="batterInfo">
    Batter info will appear here.
</div>

<div id="eventList"></div>

    <script src="script.js?v=7"></script>

</body>
</html>
